.modal .panel { width: min(900px, 92vw); max-height: 86vh; overflow-y: auto; padding: 24px; border-radius: 28px; background: var(--mat-surface-container-high); box-shadow: 0 24px 60px #0008; }
.modal h2 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
.modal p { margin: 0 0 16px; color: var(--dim); font-size: 14px; }
.modal .posters { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; margin-top: 16px; }
.modal .poster { padding: 0; aspect-ratio: 2 / 3; border-radius: 14px; overflow: hidden; background: var(--well); position: relative; }
.modal .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
.modal .poster { font: 600 11px var(--sans); text-align: center; color: var(--dim); }
.modal .poster:hover { outline: 3px solid var(--accent); }
.modal .poster.on { outline: 3px solid var(--accent); outline-offset: 2px; }
.backbtns { display: flex; gap: 8px; }
.backbtns .wide { flex: 1; }
.meta.air { color: var(--mat-tertiary); font-weight: 600; }
.menu { max-height: min(60vh, 380px); overflow-y: auto; }
.menu [role=option] { white-space: nowrap; display: flex; align-items: center; padding: 8px 12px; border-radius: 12px; cursor: pointer; color: var(--ink); outline: none; }
.menu [role=option].active { background: var(--raised); }
.menu [role=option][aria-selected=true] { background: var(--fill-tone); color: var(--on-tone); }
.menu [role=option] i { font-style: normal; margin-left: auto; padding-left: 14px; }
@keyframes menuIn { from { opacity: 0; transform: scale(.96) translateY(-4px); } }
.ctrl button svg, .backhead button svg { width: 18px; height: 18px; fill: currentColor; vertical-align: middle; }
.backhead { display: flex; align-items: flex-start; gap: 8px; }
.backhead .name { flex: 1; padding-top: 7px; }
.backhead button { flex: none; width: 34px; height: 34px; padding: 0; display: grid; place-items: center; color: var(--dim); }
.backhead [data-tip]::after { bottom: auto; top: calc(100% + 8px); left: auto; right: 0; transform: none; }
.synopsis { font: 12px/1.45 var(--sans); color: var(--mute, var(--ink)); opacity: .85; max-height: 7.5em; overflow-y: auto; }
textarea.notes { flex: 1; min-height: 140px; resize: none; width: 100%; font: 13px/1.45 var(--sans); color: var(--ink); background: var(--well);
  border: 0; border-radius: 16px; padding: 10px 12px; }
textarea.notes:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
[data-tip] { position: relative; }
[data-tip]::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none; opacity: 0; z-index: 10;
  font: 500 12px var(--sans); color: var(--mat-inverse-on-surface); background: var(--mat-inverse-surface); border-radius: 10px; padding: 5px 10px; transition: opacity .1s; }
[data-tip]:hover::after, [data-tip]:focus-within::after { opacity: 1; }
.ctrl > :first-child[data-tip]::after { left: 0; transform: none; }
.ctrl > :last-child[data-tip]::after { left: auto; right: 0; transform: none; }
.empty { padding: 32px 0; color: var(--dim); text-align: center; grid-column: 1 / -1; }
#status { position: fixed; left: 50%; transform: translateX(-50%); top: 16px; z-index: 6; font: 500 13px var(--sans); background: var(--mat-inverse-surface); color: var(--mat-inverse-on-surface);

.looks { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 16px 0; }

html[data-look] input:not([type=checkbox]):not([type=radio]), html[data-look] .bar button, html[data-look] form.add button, html[data-look] .ctrl button,

html[data-look] li:hover { transform: translate(-2px, -2px); box-shadow: var(--lk-shadow-hover); }
html[data-look] .wordmark { letter-spacing: var(--lk-track); }

/* Paper / Manga: ink on cream, halftone dots, hard shadows, one red spot colour */
html[data-look=paper] { --lk-r: 0px; --lk-bw: 2px; --lk-line: #111; --lk-track: .04em; --lk-shadow: 4px 4px 0 #111; --lk-shadow-hover: 7px 7px 0 #111; }

html[data-look=paper] h2, html[data-look=paper] .name { font-family: Impact, "Arial Narrow Bold", "Arial Black", sans-serif; letter-spacing: .02em; font-weight: 700; }

/* Neon Tokyo: dark blue-black, glowing pink and cyan edges */
html[data-look=neon] { --lk-r: 6px; --lk-bw: 1px; --lk-line: #ff3cc7; --lk-track: .12em; --lk-shadow: 0 0 0 1px #19f0ff44, 0 0 18px #ff3cc733; --lk-shadow-hover: 0 0 0 1px #19f0ff, 0 0 26px #ff3cc7aa; }
html[data-look=neon] body { background-image: linear-gradient(#19f0ff0d 1px, transparent 1px), linear-gradient(90deg, #19f0ff0d 1px, transparent 1px), radial-gradient(ellipse at 20% 0, #ff3cc722, transparent 55%), radial-gradient(ellipse at 90% 100%, #19f0ff1f, transparent 55%);
  background-size: 46px 46px, 46px 46px, auto, auto; background-attachment: fixed; }
html[data-look=neon] .wordmark { text-shadow: 0 0 22px #ff3cc788; text-transform: uppercase; }
html[data-look=neon] .name, html[data-look=neon] .tabs button, html[data-look=neon] .bar button { text-transform: uppercase; letter-spacing: .06em; }
html[data-look=neon] li, html[data-look=neon] .bar button, html[data-look=neon] .blk, html[data-look=neon] input:not([type=checkbox]):not([type=radio]) { border-color: #ff3cc799 !important; }

html[data-look=neon] .tabs .thumb { box-shadow: 0 0 16px #ff3cc788; }

/* Retro 90s anime: cream paper, navy outlines, sticker buttons, sunburst + scanlines */
html[data-look=retro] { --lk-r: 14px; --lk-bw: 3px; --lk-line: #1d1b3a; --lk-track: .02em; --lk-shadow: 5px 5px 0 #1d1b3a; --lk-shadow-hover: 8px 8px 0 #1d1b3a; }
html[data-look=retro] body { background-image: repeating-conic-gradient(from 0deg at 50% -10%, #ffd23f33 0deg 6deg, transparent 6deg 12deg); background-attachment: fixed; }
html[data-look=retro] body::after { content: ""; position: fixed; inset: 0; z-index: 40; pointer-events: none; background: repeating-linear-gradient(0deg, #0000 0 2px, #1d1b3a0d 2px 3px); }
html[data-look=retro] .wordmark { background: none; color: #ee2e6b; -webkit-text-fill-color: #ee2e6b; -webkit-text-stroke: 3px #1d1b3a; paint-order: stroke fill; text-shadow: 5px 5px 0 #1d1b3a; font-family: "Arial Black", "Trebuchet MS", sans-serif; font-weight: 900; }
html[data-look=retro] li:nth-child(odd) { transform: rotate(-.5deg); }

html[data-look=retro] .tabs .thumb { box-shadow: 0 0 0 3px #1d1b3a; }
</style>
</head>

<script>
// Any streaming site works. Each season stores one episode link with {ep} where the episode
// number goes ("1=https://site/watch/show-ep-{ep}; 2=..."); it is made from a pasted link.
let siteSearch = "";    // the site's search page with {q} for the title, "" until set up
const parseLinks = str => Object.fromEntries((str || "").split(";").map(x => x.trim()).filter(Boolean)
  .map(x => [x.slice(0, x.indexOf("=")), x.slice(x.indexOf("=") + 1)]));
const fmtLinks = obj => Object.entries(obj).filter(([, u]) => u).map(([n, u]) => `${n}=${u}`).join("; ");
const linkFor = (it, s) => parseLinks(it.links)[s] || "";
// Miruro ids are opaque (/watch/<id>/<slug>?ep=<n>); links saved from it before templates still work.
const LINK_RE = /^(https?:\/\/[^/]+)\/(?:watch|info)\/([^/?#]+)(?:\/([^/?#]+))?/i;
function watchUrl(link, ep) {
  if (link.includes("{ep}")) return link.split("{ep}").join(ep);
  const m = /miruro/i.test(link) && LINK_RE.exec(link);
  return m ? `${m[1]}/watch/${m[2]}${m[3] ? "/" + m[3] : ""}?ep=${ep}` : link;
}
// Turn a pasted link for episode `ep` into a template, or null if the number isn't in it.
function toTemplate(url, ep) {
  if (url.includes("{ep}")) return url;
  const o = /^https?:\/\/[^/]*/i.exec(url)[0], rest = url.slice(o.length);
  const n = String(ep), hits = [];
  for (let i = rest.indexOf(n); i >= 0; i = rest.indexOf(n, i + 1))
    if (!/\d/.test(rest[i - 1] || "") && !/\d/.test(rest[i + n.length] || "")) hits.push({ index: i });
  if (!hits.length) return null;
  const labelled = hits.filter(h => /(ep(isodes?)?|e)[-_=/ ]?$/i.test(rest.slice(0, h.index)));
  const h = labelled.length ? labelled[labelled.length - 1] : hits[hits.length - 1];
  return o + rest.slice(0, h.index) + "{ep}" + rest.slice(h.index + String(ep).length);
}
const searchUrl = name => siteSearch.split("{q}").join(encodeURIComponent(name));
const STATUSES = [["not started", "Not started"], ["started", "Started"], ["on hold", "On hold"], ["finished", "Finished"], ["dropped", "Dropped"]];
const TABS = [["started", "Started"], ["on hold", "On hold"], ["not started", "Not started"], ["finished", "Finished"], ["dropped", "Dropped"], ["recs", "Recommended"], ["all", "All"], ["airing", "Airing"]];
let items = [], q = "";
let tab = localStorage.getItem("tab2");
if (!TABS.some(([k]) => k === tab)) tab = "started";
const SORTS = [["az", "A–Z"], ["za", "Z–A"], ["added", "Recently added"], ["year", "Newest year"], ["rating", "Highest rated"], ["mal", "MAL score"], ["malpop", "MAL popularity"]];
let sortBy = localStorage.getItem("sort");
if (!SORTS.some(([k]) => k === sortBy)) sortBy = "az";
const byName = (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base", numeric: true });
const score = it => infoOf[it.name]?.mal_score || (infoOf[it.name]?.al_score || 0) / 10;   // MAL's, else AniList's
const SORT_FNS = {
  az: byName,
  za: (a, b) => byName(b, a),
  added: (a, b) => items.indexOf(b) - items.indexOf(a),    // new titles are appended to the sheet
  rating: (a, b) => (+b.rating || 0) - (+a.rating || 0) || byName(a, b),
  mal: (a, b) => score(b) - score(a) || byName(a, b),
  malpop: (a, b) => (infoOf[a.name]?.mal_pop || 1e9) - (infoOf[b.name]?.mal_pop || 1e9) || byName(a, b),   // #1 is the most popular
  year: (a, b) => (infoOf[b.name]?.year || 0) - (infoOf[a.name]?.year || 0) || byName(a, b),
};
// Titles can be shown in English (as saved), Japanese in Latin letters (romaji) or in Japanese script. Only the display changes: the saved name stays.
const TITLE_LANGS = [["en", "English"], ["ro", "Japanese (romaji)"], ["jp", "Japanese (日本語)"]];
let titleLang = TITLE_LANGS.some(([k]) => k === localStorage.getItem("titleLang")) ? localStorage.getItem("titleLang") : "en";
const shownName = it => titleLang === "en" ? it.name : infoOf[it.name]?.titles?.[titleLang] || it.name;
const shownTitle = o => titleLang === "en" ? o.title : o[titleLang] || o.title;   // a Discover or Calendar row
const infoOf = {};      // title -> {year, rating, ratingText, uncensored, tags}, false if unavailable
const filt = { year: "", rating: "", with: "", tags: new Set() };
const splitWith = it => (it.with || "").split(",").map(x => x.trim().toLowerCase()).filter(Boolean);
let view = ["list", "calendar", "discover", "manga", "stats", "friends"].includes(localStorage.getItem("view")) ? localStorage.getItem("view") : "list";
let fHidden = new Set(JSON.parse(localStorage.getItem("fhidden") || "[]"));   // friends whose picks are switched off
let fSub = localStorage.getItem("fsub") === "compare" ? "compare" : "picks", fWho = "", fQ = "";   // Friends view: sub-tab, who to compare with, search
let friends = [], me = "", myIds = new Set();   // myIds: AniList ids of the shows on your list   // friends: [{from, items}] imported recommendations
const RATING_ORDER = ["G", "PG", "PG-13", "R-17+", "R+", "Rx"];
const UNC_RE = /unc\w*sored|unrated/i;   // "Uncesored" typos count
const seasonsOf = {};   // title -> [{n, id, episodes}] from AniList, false if unavailable
const coverBust = {};

const $ = id => document.getElementById(id);
const isMovie = it => /^movie$/i.test(it.progress) || (!parse(it.progress) && infoOf[it.name]?.format === "MOVIE");   // AniList says movie, or it was added as one
const parse = p => { const m = /^S(\d+)(?:\s*E(\d+))?$/i.exec(p); return m ? { s: +m[1], e: +(m[2] || 0) } : null; };
const fmt = ({ s, e }) => e ? `S${s} E${e}` : `S${s}`;
const el = (tag, props = {}) => Object.assign(document.createElement(tag), props);
const elc = (tag, props, ...kids) => { const n = el(tag, props); n.append(...kids); return n; };   // el with children

async function save() {
  try {
    const r = await fetch("/api/items", { method: "PUT", body: JSON.stringify(items) });
    if (!r.ok) throw new Error((await r.json()).error);
    flash("Saved to sheet");
    if (sLog !== null) loadLog();
  } catch (e) { flash("Save failed: " + e.message, true); }
}

function edit(it, fn) { fn(it); render(); save(); }

// Season / episode state for one show. Not started reads as S1 with no episode.
const where = it => parse(it.progress) || { s: 1, e: 0 };
const seasonCount = it => it.name in seasonsOf && seasonsOf[it.name] ? seasonsOf[it.name].length : null;
const epCount = (it, s) => seasonsOf[it.name]?.[s - 1]?.episodes ?? null;

function setWhere(it, s, e) {
  it.progress = e || s > 1 ? fmt({ s, e }) : "";
  // No episode (E–) always means not started, whatever season is picked.
  if (!e) { if (it.status === "started") it.status = "not started"; }
  else if (it.status === "not started" || it.status === "on hold") it.status = "started";
}

// The episode the play button opens: one past the current one, rolling into the next season.
function nextEpisode(it) {
  const list = seasonsOf[it.name];
  if (isMovie(it)) return { s: 1, e: 1 };
  let { s, e } = where(it);
  const count = epCount(it, s);
  if (count !== null && e >= count) {
    if (!list || s >= list.length) return null;
    s++; e = 0;
  }
  return { s, e: e + 1 };
}

// Ask for an episode link for one season (any episode's page works; the number is swapped in later).
function askLink(it, s, ep) {
  const what = isMovie(it) ? it.name : `${it.name} — Season ${s}, episode ${ep}`;
  const v = prompt(`Paste the link to ${what} on your streaming site\n(open that episode there and copy the address)`, linkFor(it, s));
  if (v === null) return null;
  let t = v.trim();
  if (t && !/^https?:\/\/[^/\s]+/i.test(t)) { flash("That doesn't look like a web link", true); return null; }
  if (t && !isMovie(it) && !t.includes("{ep}") && !/miruro/i.test(t)) {
    let tpl = toTemplate(t, ep);
    if (!tpl) {
      const n = prompt("Which episode number is that link for?\n(so the number can be swapped for other episodes)", ep);
      tpl = n && /^\d+$/.test(n.trim()) ? toTemplate(t, +n) : null;
    }
    if (tpl) t = tpl; else flash("No episode number in that link, so it will open that page as-is");
  }
  const links = parseLinks(it.links);
  links[s] = t;
  edit(it, i => i.links = fmtLinks(links));
  return t;
}

function askSite() {
  const v = prompt('Open your streaming site, search for "naruto", and paste the address of the results page.\n(Leave empty to turn title search links off)', siteSearch);
  if (v === null) return;
  let t = v.trim();
  if (t && !/^https?:\/\/[^/\s]+/i.test(t)) return flash("That doesn't look like a web link", true);
  if (t && !t.includes("{q}")) {
    const i = t.search(/naruto/i);
    if (i >= 0) t = t.slice(0, i) + "{q}" + t.slice(i + 6);
    else flash('"naruto" isn\'t in that address, so titles will open the site\'s search page as-is');
  }
  siteSearch = t;
  fetch("/api/settings", { method: "PUT", body: JSON.stringify({ search: t }) })
    .then(r => { if (!r.ok) throw 0; flash("Streaming site saved"); }).catch(() => flash("Couldn't save the site", true));
  render();
}

// True when AniList shows an episode out that's past the one logged (only for shows being watched).
function hasNew(it) {
  if (it.status !== "started" || isMovie(it) || !seasonsOf[it.name]) return false;
  const { s, e } = where(it);
  const count = epCount(it, s);
  if (count === null) return false;
  return e < count || (epCount(it, s + 1) ?? 0) > 0;
}

async function showChangelog() {
  let text = "";
  try { const r = await fetch("/api/changelog"); text = r.ok ? await r.text() : ""; } catch {}
  const overlay = el("div", { className: "modal" }), panel = el("div", { className: "panel" });
  const close = () => { overlay.remove(); document.removeEventListener("keydown", onKey, true); };
  const onKey = ev => { if (ev.key === "Escape") { ev.stopImmediatePropagation(); close(); } };
  document.addEventListener("keydown", onKey, true);
  overlay.onmousedown = ev => { if (ev.target === overlay) close(); };
  const md = el("div", { className: "md" });
  const inline = t => t.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  let ul = null;
  for (const line of (text || "No changelog found.").split("\n")) {
    if (line.startsWith("- ")) {
      if (!ul) { ul = el("ul"); md.append(ul); }
      const li = el("li"); li.innerHTML = inline(line.slice(2)); ul.append(li);
      continue;
    }
    ul = null;
    if (!line.trim()) continue;
    const node = el(line.startsWith("## ") ? "h3" : line.startsWith("# ") ? "h2" : "p");
    node.innerHTML = inline(line.replace(/^#+ /, ""));
    md.append(node);
  }
  panel.append(md, el("button", { textContent: "Close", onclick: close, style: "margin-top:14px" }));
  overlay.append(panel);
  document.body.append(overlay);
}

      items.push({ name, progress: movie ? "Movie" : e ? fmt({ s: 1, e }) : "", status, notes: "", cover: "", links: "",
        rating: score >= 1 && score <= 10 ? String(score) : "", pinned: false, rec: false, with: "" });
      added++;
    }
    if (!added) return flash(`Nothing new: all ${skipped} shows are already on your list`);
    tab = "all"; localStorage.setItem("tab2", tab);
    render(); save();
    flash(`Added ${added} shows from MyAnimeList${skipped ? ` (${skipped} already on your list)` : ""}. Covers fill in as you scroll.`);
  } catch { flash("Couldn't read that file", true); }
};
// Anime-Planet export (.json): {user, entries: [{name, status, eps, rating (0-5 stars), ...}]}; adds what isn't on the list yet.
const AP_STATUS = { "watching": "started", "watched": "finished", "want to watch": "not started", "stalled": "on hold", "dropped": "dropped" };
$("apFile").onchange = async ev => {
  const f = ev.target.files[0];
  ev.target.value = "";
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const rows = Array.isArray(data) ? data : data.entries;
    if (!Array.isArray(rows) || !rows.some(r => r && (r.name || r.title) && r.status)) return flash("That doesn't look like an Anime-Planet export", true);
    const have = new Set(items.map(i => i.name.toLowerCase()));
    let added = 0, skipped = 0, wont = 0;
    for (const r of rows) {
      const name = String(r.name || r.title || "").trim(), st = String(r.status || "").toLowerCase();
      if (st === "won't watch") { wont++; continue; }   // nothing on this list matches "won't watch"
      if (!name || have.has(name.toLowerCase())) { skipped++; continue; }
      have.add(name.toLowerCase());
      const status = AP_STATUS[st] || "not started";
      const movie = /movie/i.test(String(r.type || ""));
      const seen = Math.max(0, parseInt(r.eps) || 0);
      const e = status === "finished" ? Math.max(seen, 1) : seen;   // an episode must be picked, or the show would count as Not started
      const stars = Math.round((+r.rating || 0) * 2);   // Anime-Planet scores in half-stars out of 5
      items.push({ name, progress: movie ? "Movie" : e ? fmt({ s: 1, e }) : "", status, notes: "", cover: "", links: "",
        rating: stars >= 1 && stars <= 10 ? String(stars) : "", pinned: false, rec: false, with: "" });
      added++;
    }
    if (!added) return flash(`Nothing new: all ${skipped} shows are already on your list`);
    tab = "all"; localStorage.setItem("tab2", tab);
    render(); save();
    flash(`Added ${added} shows from Anime-Planet${skipped ? ` (${skipped} already on your list)` : ""}${wont ? `, ${wont} "won't watch" left out` : ""}. Covers fill in as you scroll.`);
  } catch { flash("Couldn't read that file", true); }
};
$("restoreFile").onchange = async ev => {
  const f = ev.target.files[0];
  ev.target.value = "";
  if (!f || !confirm(`Replace your whole list with "${f.name}"?\nYour current list is kept next to it as "Anime Watch List.xlsx.bak-before-restore".`)) return;
  const r = await fetch("/api/restore", { method: "POST", body: f });
  const d = await r.json();
  if (!r.ok) return flash(d.error, true);
  flash(`Restored ${d.count} titles`);
  setTimeout(() => location.reload(), 900);
};
$("addBtn").className = "has-i"; $("addBtn").prepend(ico("add"));
$("clearBtn").className = "clear has-i"; $("clearBtn").prepend(ico("close"));
$("clearBtn").onclick = () => { filt.year = filt.rating = filt.with = ""; filt.tags.clear(); render(); };
$("q").oninput = ev => { q = ev.target.value.toLowerCase(); render(); };

// Back-to-top button: pops up from the bottom with the same jelly overshoot as the tab pill, and drops away again near the top.
{
  const b = $("toTop"); let shown = false, anim = null;
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const set = on => {
    if (on === shown) return; shown = on;
    anim?.cancel(); b.getAnimations().forEach(a => a.cancel());
    if (on) b.classList.add("show");
    if (calm()) { if (!on) b.classList.remove("show"); return; }
    if (on) {
      anim = b.animate([{ transform: "translateY(90px)", opacity: 0 }, { transform: "translateY(0)", opacity: 1 }], { duration: 600, easing: "cubic-bezier(.34, 1.75, .5, 1)", fill: "backwards" });
      b.animate([{ scale: ".6 1.3" }, { scale: "1.16 .82", offset: .35 }, { scale: ".95 1.07", offset: .65 }, { scale: "1 1" }], { duration: 600, easing: "ease-out" });
    } else {
      anim = b.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(90px)", opacity: 0 }], { duration: 220, easing: "ease-in", fill: "forwards" });
      anim.onfinish = () => { if (!shown) { b.classList.remove("show"); anim.cancel(); } };
    }
  };
  addEventListener("scroll", () => set(scrollY > 300), { passive: true });
  b.onclick = () => scrollTo({ top: 0, behavior: calm() ? "auto" : "smooth" });
}

fetch("/api/settings").then(r => r.json()).then(d => { siteSearch = d.search || ""; me = d.me || ""; applyTheme(d.theme || null); applyLook(d.look || "", d.lookPick); }).catch(() => {})
  .then(() => fetch("/api/items")).then(r => r.json()).then(d => {
    items = d;
    // Older lists can hold "started" shows with no episode (E–); those are not started.
    const stale = items.filter(i => i.status === "started" && parse(i.progress) && !parse(i.progress).e);
    stale.forEach(i => i.status = "not started");
    if (stale.length) save();
    render(); return Promise.all([loadFriends(), loadIds()]); }).then(render)
  .catch(() => flash("Can't reach server.py", true));
</script>
